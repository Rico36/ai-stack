title: Home
views:
  - title: Main
    path: main
    icon: mdi:home-lightning-bolt
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: GOAT Mowing Schedule
            show_header_toggle: false
            entities:
              - entity: input_boolean.goat_automation_enabled
                name: GOAT Automation Enabled
              - entity: lawn_mower.goat_a3000_lidar_pro
                name: GOAT Status
                icon: mdi:robot-mower
              - type: section
                label: Scheduled Mowing
              - entity: input_datetime.goat_mowing_start_time
                name: Scheduled Start Time
              - entity: input_select.goat_mow_mode
                name: Mow Mode
              - entity: input_text.goat_zone_ids
                name: Zone IDs (Map to Areas)
              - entity: input_text.goat_gate_free_zones
                name: Zones Not Needing Gate
                icon: mdi:gate
          - type: grid
            columns: 7
            square: true
            cards:
              - type: custom:button-card
                entity: input_boolean.goat_schedule_mon
                name: Mon
                show_icon: false
                show_state: false
                tap_action:
                  action: toggle
                state:
                  - value: 'on'
                    styles:
                      card:
                        - background-color: green
                      name:
                        - color: white
                        - font-weight: bold
                  - value: 'off'
                    styles:
                      card:
                        - background-color: var(--card-background-color)
                      name:
                        - color: var(--primary-text-color)
                        - font-weight: normal
              - type: custom:button-card
                entity: input_boolean.goat_schedule_tue
                name: Tue
                show_icon: false
                show_state: false
                tap_action:
                  action: toggle
                state:
                  - value: 'on'
                    styles:
                      card:
                        - background-color: green
                      name:
                        - color: white
                        - font-weight: bold
                  - value: 'off'
                    styles:
                      card:
                        - background-color: var(--card-background-color)
                      name:
                        - color: var(--primary-text-color)
                        - font-weight: normal
              - type: custom:button-card
                entity: input_boolean.goat_schedule_wed
                name: Wed
                show_icon: false
                show_state: false
                tap_action:
                  action: toggle
                state:
                  - value: 'on'
                    styles:
                      card:
                        - background-color: green
                      name:
                        - color: white
                        - font-weight: bold
                  - value: 'off'
                    styles:
                      card:
                        - background-color: var(--card-background-color)
                      name:
                        - color: var(--primary-text-color)
                        - font-weight: normal
              - type: custom:button-card
                entity: input_boolean.goat_schedule_thu
                name: Thu
                show_icon: false
                show_state: false
                tap_action:
                  action: toggle
                state:
                  - value: 'on'
                    styles:
                      card:
                        - background-color: green
                      name:
                        - color: white
                        - font-weight: bold
                  - value: 'off'
                    styles:
                      card:
                        - background-color: var(--card-background-color)
                      name:
                        - color: var(--primary-text-color)
                        - font-weight: normal
              - type: custom:button-card
                entity: input_boolean.goat_schedule_fri
                name: Fri
                show_icon: false
                show_state: false
                tap_action:
                  action: toggle
                state:
                  - value: 'on'
                    styles:
                      card:
                        - background-color: green
                      name:
                        - color: white
                        - font-weight: bold
                  - value: 'off'
                    styles:
                      card:
                        - background-color: var(--card-background-color)
                      name:
                        - color: var(--primary-text-color)
                        - font-weight: normal
              - type: custom:button-card
                entity: input_boolean.goat_schedule_sat
                name: Sat
                show_icon: false
                show_state: false
                tap_action:
                  action: toggle
                state:
                  - value: 'on'
                    styles:
                      card:
                        - background-color: green
                      name:
                        - color: white
                        - font-weight: bold
                  - value: 'off'
                    styles:
                      card:
                        - background-color: var(--card-background-color)
                      name:
                        - color: var(--primary-text-color)
                        - font-weight: normal
              - type: custom:button-card
                entity: input_boolean.goat_schedule_sun
                name: Sun
                show_icon: false
                show_state: false
                tap_action:
                  action: toggle
                state:
                  - value: 'on'
                    styles:
                      card:
                        - background-color: green
                      name:
                        - color: white
                        - font-weight: bold
                  - value: 'off'
                    styles:
                      card:
                        - background-color: var(--card-background-color)
                      name:
                        - color: var(--primary-text-color)
                        - font-weight: normal
          - type: entities
            title: Mowing Status
            show_header_toggle: false
            entities:
              - type: section
                label: Manual Mowing
              - type: custom:template-entity-row
                name: Start Mowing Now
                icon: >
                  {% if is_state('input_boolean.goat_mowing_session_active',
                  'on') %}
                    mdi:robot-mower
                  {% else %}
                    mdi:play-circle
                  {% endif %}
                active: >
                  {{ is_state('input_boolean.goat_mowing_session_active', 'on')
                  or
                     is_state('input_boolean.goat_departure_window_active', 'on') }}
                state: >
                  {% if is_state('input_boolean.goat_mowing_session_active',
                  'on') %}
                    Mowing Active
                  {% elif is_state('input_boolean.goat_departure_window_active',
                  'on') %}
                    Starting…
                  {% else %}
                    Tap to start
                  {% endif %}
                tap_action:
                  action: call-service
                  service: script.goat_start_mowing_now
              - type: section
                label: Grass Condition
              - entity: input_select.goat_grass_status
                name: Grass Status
                icon: mdi:grass
              - type: custom:template-entity-row
                name: Active Flags
                icon: mdi:flag-outline
                state: >
                  {% set o =
                  is_state('input_boolean.goat_grass_status_override', 'on') %}
                  {% set d = is_state('input_boolean.goat_delta_rule_active',
                  'on') %} {% if o and d %}Override + Delta {% elif o %}Override
                  {% elif d %}Delta {% else %}— {% endif %}
              - entity: sensor.front_rain_sensor_soil_moisture
                name: Soil Moisture
                icon: mdi:water-percent
              - entity: sensor.lawn_back_soil_moisture
                name: Back Soil Moisture
              - entity: input_number.goat_moisture_baseline
                name: Last Dry Baseline
              - type: section
                label: Yard Access
              - type: custom:template-entity-row
                name: Backyard Gate
                icon: >
                  {% if is_state('binary_sensor.backyard_gate_contact', 'on') %}
                    mdi:gate-open
                  {% else %}
                    mdi:gate
                  {% endif %}
                active: "{{ is_state('binary_sensor.backyard_gate_contact', 'on') }}"
                state: >
                  {% set open = is_state('binary_sensor.backyard_gate_contact',
                  'on') %} {% set free =
                  states('input_text.goat_gate_free_zones').split(',') |
                  map('trim') | reject('eq','') | list %} {% set want =
                  states('input_text.goat_zone_ids').split(',') | map('trim') |
                  reject('eq','') | list %} {% set areas =
                  states('input_select.goat_mow_mode').startswith('Areas') %} {%
                  set needed = not (areas and want | count > 0 and want |
                  reject('in', free) | list | count == 0) %} {% if open %}Open
                  {% elif needed %}Closed — front zones blocked {% else %}Closed
                  — not needed today {% endif %}
              - type: section
                label: Session Status
              - type: custom:template-entity-row
                name: HA Start In Progress
                icon: mdi:exit-run
                state: >
                  {% if is_state('input_boolean.goat_departure_window_active',
                  'on') %}
                    Yes
                  {% else %}
                    No
                  {% endif %}
              - type: custom:template-entity-row
                name: Mowing Session Active
                icon: mdi:robot-mower
                state: >
                  {% if is_state('input_boolean.goat_mowing_session_active',
                  'on') %}
                    Yes
                  {% else %}
                    No
                  {% endif %}
              - entity: input_boolean.goat_makeup_pending
                name: Makeup Mow Pending
              - type: section
                label: Last Session
              - type: custom:template-entity-row
                name: Last Mowing Started
                icon: mdi:clock-start
                state: >
                  {% set dt =
                  states('input_datetime.goat_mowing_session_started_at') %} {%
                  if dt not in ['unknown','unavailable',''] %}
                    {{ as_timestamp(dt) | timestamp_custom('%b %d, %Y %I:%M %p') }}
                  {% else %}
                    Never
                  {% endif %}
              - type: custom:template-entity-row
                name: Last Decision
                icon: mdi:clock-outline
                state: >
                  {% set dt = states('input_datetime.goat_last_mowing_decision')
                  %} {% if dt not in ['unknown','unavailable',''] %}
                    {{ as_timestamp(dt) | timestamp_custom('%b %d %I:%M %p') }}
                    — {{ states('input_text.goat_last_mowing_status') }}
                  {% else %}
                    Never
                  {% endif %}
