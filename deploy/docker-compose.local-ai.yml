services:
  n8n:
    environment:
      N8N_FILESYSTEM_EXPOSED_PATHS: /files,/data/assistant-memory
      MEMORY_CAPTURE_TOKEN: ${MEMORY_CAPTURE_TOKEN}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:14b-instruct-q4_K_M}
      OLLAMA_SUMMARY_MODEL: ${OLLAMA_SUMMARY_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      WORLD_CONTEXT_MAX_ITEMS: ${WORLD_CONTEXT_MAX_ITEMS:-12}
      WORLD_CONTEXT_LOOKBACK_DAYS: ${WORLD_CONTEXT_LOOKBACK_DAYS:-2}
      ANYTHINGLLM_API_BASE: ${ANYTHINGLLM_API_BASE:-http://host.docker.internal:3001}
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY}
      ANYTHINGLLM_WORKSPACE_SLUG: ${ANYTHINGLLM_WORKSPACE_SLUG}
      ANYTHINGLLM_UPLOAD_FOLDER: ${ANYTHINGLLM_UPLOAD_FOLDER:-assistant-memory}
      ANYTHINGLLM_SYNC_RUNTIME_CONTEXT: ${ANYTHINGLLM_SYNC_RUNTIME_CONTEXT:-false}
    volumes:
      - ${LOCAL_AI_DATA_ROOT:-./local-ai-data/assistant-memory}:/data/assistant-memory

  open-webui:
    volumes:
      - ${LOCAL_AI_DATA_ROOT:-./local-ai-data/assistant-memory}:/data/assistant-memory:ro

networks:
  ai_net:
    external: true